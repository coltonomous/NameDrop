name: Tests

on:
  # Every branch push, so results show on its pull request before merging.
  push:
    branches-ignore: [main]
  # Deploys run these first (see deploy.yml).
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Analyze
        working-directory: client
        run: flutter analyze

      - name: Test
        working-directory: client
        run: flutter test

  builder:
    name: DB builder tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Test
        run: python -m unittest discover scripts
